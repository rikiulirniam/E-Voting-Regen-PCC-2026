name: CI/CD Laravel ke Shared Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Verify Winner Audio Assets
        run: |
          test -f public/assets/audio/drumroll.wav
          test -f public/assets/audio/tadaa.wav
          ls -lah public/assets/audio

      - name: Setup PHP & Install Dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Prepare Composer Workspace
        run: |
          rm -rf vendor

      - name: Install PHP Dependencies (Production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Clear Laravel Cached Files Before Upload
        run: |
          rm -f bootstrap/cache/*.php
          rm -f storage/framework/views/*.php
          rm -f storage/framework/cache/data/*

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.github/**

      - name: Verify Deployed Audio URLs (Optional)
        if: ${{ env.APP_URL != '' }}
        run: |
          curl -fI "$APP_URL/assets/audio/drumroll.wav"
          curl -fI "$APP_URL/assets/audio/tadaa.wav"