name: CI/CD Laravel ke Shared Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Verify Winner Audio In Build
        run: |
          test -f resources/audio/drumroll.wav
          test -f resources/audio/tadaa.wav
          test -f public/build/manifest.json
          grep -q 'resources/audio/drumroll.wav' public/build/manifest.json
          grep -q 'resources/audio/tadaa.wav' public/build/manifest.json

      - name: Setup PHP & Install Dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Prepare Composer Workspace
        run: |
          rm -rf vendor

      - name: Install PHP Dependencies (Production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Clear Laravel Cached Files Before Upload
        run: |
          rm -f bootstrap/cache/*.php
          rm -f storage/framework/views/*.php
          rm -f storage/framework/cache/data/*

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.github/**

      - name: Verify Deployed Audio URLs (Optional)
        if: ${{ env.APP_URL != '' }}
        run: |
          DRUMROLL_PATH=$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('public/build/manifest.json','utf8')); process.stdout.write('/build/' + m['resources/audio/drumroll.wav'].file);")
          TADAA_PATH=$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('public/build/manifest.json','utf8')); process.stdout.write('/build/' + m['resources/audio/tadaa.wav'].file);")

          check_url () {
            local url="$1"
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$url" || echo "000")

            if [ "$code" = "200" ]; then
              echo "OK: $url (HTTP $code)"
              return 0
            fi

            if [ "$code" = "403" ]; then
              echo "WARNING: $url returned HTTP 403 (likely Cloudflare challenge from GitHub runner)."
              echo "This check is inconclusive but deployment continues."
              return 0
            fi

            echo "ERROR: $url returned HTTP $code"
            return 1
          }

          check_url "$APP_URL$DRUMROLL_PATH"
          check_url "$APP_URL$TADAA_PATH"